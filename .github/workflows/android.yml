name: Android M0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install explicit platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate asset contracts
        run: |
          python3 -m pip install --requirement scripts/requirements.txt
          python3 scripts/verify-assets.py
          python3 scripts/verify-anatomy.py
      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-build-and-reports
          path: |
            app/build/outputs/apk/
            **/build/reports/
  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            ./gradlew connectedDebugAndroidTest
            mkdir -p app/build/outputs/m0-screenshots
            adb pull /sdcard/Android/data/com.gymrpg/files/m0-screenshots/. app/build/outputs/m0-screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/m0-screenshots/
            app/build/outputs/connected_android_test_additional_output/
